<!doctype html>
<html lang="ru">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
    <meta name="theme-color" content="#f7f6f4" media="(prefers-color-scheme: light)"/>
    <meta name="theme-color" content="#2a2a2a" media="(prefers-color-scheme: dark)"/>

    <title>Занятия с ребёнком</title>

    <link rel="manifest" href="manifest.json"/>
    <link rel="stylesheet" href="styles.css"/>

    <link rel="icon" type="image/svg+xml" href="icons/favicon.svg"/>
    <link rel="apple-touch-icon" href="icons/icon-192.png"/>
</head>
<body>

<header id="top" class="hidden">
    <select id="child-select" data-i18n-label="selectChild"></select>
    <span id="child-age" class="help"></span>
</header>

<!-- ==========================================================================
     СЕГОДНЯ
     ========================================================================== -->

<section id="today-page" class="page">
    <p id="today-date" class="help"></p>

    <div id="welcome" class="col gap-15 hidden">
        <h1 data-i18n="welcomeTitle"></h1>
        <p data-i18n="welcomeText"></p>
        <p class="help small" data-i18n="localDataNote"></p>
        <button class="primary add-child" data-i18n="addChild"></button>
    </div>
</section>

<!-- ==========================================================================
     ЗАНЯТИЯ
     ========================================================================== -->

<section id="activities-page" class="page hidden">
    <div class="col gap-10">
        <h1 data-i18n="activities"></h1>
        <input id="search" class="input" type="search" autocomplete="off" enterkeyhint="search"
               data-i18n-placeholder="searchPlaceholder" data-i18n-label="searchPlaceholder">
        <div class="filters">
            <select id="filter-area" class="input" data-i18n-label="filterArea"></select>
            <select id="filter-age" class="input" data-i18n-label="filterAge"></select>
            <select id="filter-duration" class="input" data-i18n-label="filterDuration"></select>
            <select id="filter-interest" class="input" data-i18n-label="filterInterest"></select>
        </div>
        <p id="catalogue-status" class="help small"></p>
    </div>
    <ul id="activity-list" class="list"></ul>
    <p id="activity-empty" class="help hidden" data-i18n="nothingFound"></p>
</section>

<!-- ==========================================================================
     ИСТОРИЯ
     ========================================================================== -->

<section id="history-page" class="page hidden">
    <h1 data-i18n="history"></h1>
</section>

<!-- ==========================================================================
     РЕБЁНОК
     ========================================================================== -->

<section id="child-page" class="page hidden">
    <div id="child-none" class="col gap-15">
        <h1 data-i18n="child"></h1>
        <p data-i18n="noChildText"></p>
        <button class="primary add-child" data-i18n="addChild"></button>
    </div>

    <div id="child-profile" class="col gap-30">
        <section class="col gap-5">
            <div class="row between">
                <h1 id="child-name"></h1>
                <button id="child-edit" class="link" data-i18n="edit"></button>
            </div>
            <p id="child-info" class="help"></p>
        </section>

        <section class="col gap-10">
            <h2 data-i18n="skillsTitle"></h2>
            <p class="help small" data-i18n="skillsNote"></p>
            <div id="skills"></div>
        </section>

        <section class="col gap-10">
            <h2 data-i18n="interestsTitle"></h2>
            <p class="help small" data-i18n="interestsNote"></p>
            <div id="interests" class="chips"></div>
        </section>

        <section class="col gap-15">
            <div class="col gap-5">
                <h2 data-i18n="conditionsTitle"></h2>
                <p class="help small" data-i18n="conditionsNote"></p>
            </div>
            <div class="field">
                <span class="label" data-i18n="durationLabel"></span>
                <div id="condition-duration" class="chips"></div>
            </div>
            <div class="field">
                <span class="label" data-i18n="environmentLabel"></span>
                <div id="condition-environment" class="chips"></div>
            </div>
            <div class="field">
                <span class="label" data-i18n="intensityLabel"></span>
                <div id="condition-intensity" class="chips"></div>
            </div>
            <div class="field">
                <span class="label" data-i18n="materialsLabel"></span>
                <div id="condition-materials" class="chips"></div>
            </div>
        </section>

        <section class="col gap-10">
            <button class="secondary add-child" data-i18n="addAnotherChild"></button>
            <button id="child-delete" class="link red" data-i18n="deleteChild"></button>
        </section>
    </div>
</section>

<!-- ==========================================================================
     НАСТРОЙКИ
     ========================================================================== -->

<section id="settings-page" class="page hidden">
    <h1 data-i18n="settings"></h1>
</section>

<!-- ==========================================================================
     НАВИГАЦИЯ
     ========================================================================== -->

<nav id="nav" data-i18n-label="navigation">
    <button data-page="today" class="active" aria-current="page">
        <svg aria-hidden="true">
            <use href="icons/sprite.svg#today"></use>
        </svg>
        <span data-i18n="today"></span>
    </button>
    <button data-page="activities">
        <svg aria-hidden="true">
            <use href="icons/sprite.svg#activities"></use>
        </svg>
        <span data-i18n="activities"></span>
    </button>
    <button data-page="history">
        <svg aria-hidden="true">
            <use href="icons/sprite.svg#history"></use>
        </svg>
        <span data-i18n="history"></span>
    </button>
    <button data-page="child">
        <svg aria-hidden="true">
            <use href="icons/sprite.svg#child"></use>
        </svg>
        <span data-i18n="child"></span>
    </button>
    <button data-page="settings">
        <svg aria-hidden="true">
            <use href="icons/sprite.svg#settings"></use>
        </svg>
        <span data-i18n="settings"></span>
    </button>
</nav>

<!-- ==========================================================================
     ДИАЛОГИ
     ========================================================================== -->

<dialog id="activity-dialog" class="sheet full">
    <div class="sheet-bar">
        <button type="button" class="icon-button close" data-i18n-label="close">
            <svg aria-hidden="true">
                <use href="icons/sprite.svg#close"></use>
            </svg>
        </button>
    </div>
    <article id="activity-body" class="activity sheet-scroll"></article>
</dialog>

<dialog id="child-dialog" class="sheet">
    <form id="child-form" method="dialog" class="col gap-20">
        <div class="row between">
            <h2 id="child-form-title"></h2>
            <button type="button" class="icon-button close" data-i18n-label="close">
                <svg aria-hidden="true">
                    <use href="icons/sprite.svg#close"></use>
                </svg>
            </button>
        </div>
        <label class="field">
            <span class="label" data-i18n="name"></span>
            <input id="child-name-input" class="input" required maxlength="40" pattern=".*\S.*" autocomplete="off">
        </label>
        <label class="field">
            <span class="label" data-i18n="birthDate"></span>
            <input id="child-birth-input" class="input" type="date" required>
        </label>
        <div class="field">
            <span class="label" data-i18n="gender"></span>
            <div id="child-gender" class="chips"></div>
        </div>
        <button class="primary" data-i18n="save"></button>
    </form>
</dialog>

<dialog id="confirm-dialog" class="modal">
    <form method="dialog" class="col gap-20">
        <p id="confirm-text"></p>
        <div class="row gap-10">
            <button id="confirm-no" value="no" class="secondary grow" data-i18n="cancel"></button>
            <button id="confirm-yes" value="yes" class="primary grow"></button>
        </div>
    </form>
</dialog>

<script src="script.js"></script>

</body>
</html>
